<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingsplanner</title>
<meta name="description" content="Trainingsplanner Golfacademy Almeerderhout — roosters, kalender en lesvoorbereiding voor het coachteam.">
<meta name="theme-color" content="#F2F3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/config.js"></script>
<script>
// supabase-js alleen laden als er een Supabase-configuratie is (anders demo-modus, volledig offline).
if (window.TP_CONFIG && window.TP_CONFIG.supabaseUrl) {
  document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');
}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
